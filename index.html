
<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrickSnap</title>
<style>
body{margin:0;background:#f3f5fa;font-family:Arial,sans-serif;color:#17213a}
header{background:#17213a;color:white;padding:24px;text-align:center}
h1{margin:0;font-size:32px}
main{max-width:550px;margin:auto;padding:18px}
.card{background:white;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 3px 12px #0001}
button,select,input{font-size:16px;padding:12px;border-radius:10px;border:1px solid #ccd2dc}
button{background:#ffcf37;border:0;font-weight:bold;cursor:pointer}
.controls{display:flex;gap:8px;flex-wrap:wrap}
#viewer{width:100%;height:290px;touch-action:none;background:#e7edf7;border-radius:14px}
label{display:block;margin:12px 0 6px;font-weight:bold}
li{padding:5px}
small{color:#64748b}
</style>
</head>
<body>
<header>
<h1>🧱 BrickSnap</h1>
<p>Imagine it. Build it.</p>
</header>
<main>
<div class="card">
<h2>1. Välj ditt bygge</h2>
<label>Modell</label>
<select id="model">
<option value="car">🚗 Bil</option>
<option value="house">🏠 Hus</option>
<option value="robot">🤖 Robot</option>
</select>
<label>Svårighetsgrad</label>
<select id="level">
<option value="1">Easy</option>
<option value="2">Medium</option>
<option value="3">Expert</option>
</select>
</div>
<div class="card">
<h2>2. Din 3D-modell</h2>
<div id="viewer"></div>
<p><small>Dra med fingret för att snurra. Nyp för att zooma.</small></p>
<button id="save">❤️ Spara favorit</button>
</div>
<div class="card">
<h2>3. Dina byggbitar</h2>
<ul id="parts"></ul>
<label>Hur många bitar har du hemma?</label>
<input id="owned" type="number" min="0" value="0">
<p id="missing"></p>
</div>
<div class="card">
<h2>4. Fotografera ditt föremål</h2>
<input type="file" accept="image/*" capture="environment" id="photo">
<img id="preview" style="width:100%;margin-top:12px;border-radius:12px;display:none">
<p><small>Fotot visas som referens. Automatisk omvandling kommer i en senare version.</small></p>
</div>
<div class="card">
<h2>⭐ Mina favoriter</h2>
<ul id="favorites"></ul>
</div>
</main>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js";
import {OrbitControls} from "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/controls/OrbitControls.js";
</script>
<script type="module">
import * as THREE from "https://esm.sh/three@0.160.1";
import {OrbitControls} from "https://esm.sh/three@0.160.1/examples/jsm/controls/OrbitControls.js";
const viewer=document.querySelector("#viewer");
const scene=new THREE.Scene();
scene.background=new THREE.Color("#e7edf7");
const camera=new THREE.PerspectiveCamera(45,1,.1,100);
camera.position.set(8,7,10);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
viewer.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2.5));
const light=new THREE.DirectionalLight(0xffffff,2);
light.position.set(5,10,7);scene.add(light);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
const group=new THREE.Group();scene.add(group);
const colors={red:0xe43e38,blue:0x277bd1,yellow:0xf4c438,black:0x252c39,white:0xfafafa};
let count=0;
function brick(x,y,z,w,d,color){
const material=new THREE.MeshStandardMaterial({color:colors[color]});
const box=new THREE.Mesh(new THREE.BoxGeometry(w,.8,d),material);
box.position.set(x,y,z);group.add(box);
for(let i=0;i<w;i++)for(let j=0;j<d;j++){
const stud=new THREE.Mesh(new THREE.CylinderGeometry(.28,.28,.16,16),material);
stud.position.set(x-w/2+i+.5,y+.47,z-d/2+j+.5);
group.add(stud);
}
count++;
}
function build(){
group.clear();count=0;
const type=document.querySelector("#model").value;
const level=+document.querySelector("#level").value;
if(type==="car"){
for(let n=0;n<level;n++)brick(0,n*.8,0,6,2,"red");
brick(-2,-.8,-1,1,1,"black");brick(2,-.8,-1,1,1,"black");
brick(-2,-.8,1,1,1,"black");brick(2,-.8,1,1,1,"black");
brick(0,level*.8,0,2,2,"blue");
}
if(type==="house"){
for(let n=0;n<level+1;n++)brick(0,n*.8,0,4,4,"blue");
brick(0,(level+1)*.8,0,4,4,"red");
brick(0,(level+2)*.8,0,2,2,"red");
}
if(type==="robot"){
for(let n=0;n<level+1;n++)brick(0,n*.8,0,4,2,"blue");
brick(0,(level+1)*.8,0,2,2,"yellow");
brick(-1,-.8,0,1,1,"black");brick(1,-.8,0,1,1,"black");
}
document.querySelector("#parts").innerHTML=`<li>${count} förenklade byggklossar</li><li>Modell: ${type}</li><li>Nivå: ${level}</li>`;
updateMissing();
}
function updateMissing(){
const owned=Math.max(0,+document.querySelector("#owned").value||0);
document.querySelector("#missing").textContent=`Du saknar cirka ${Math.max(0,count-owned)} klossar i denna demo.`;
}
document.querySelector("#model").onchange=build;
document.querySelector("#level").onchange=build;
document.querySelector("#owned").oninput=updateMissing;
const key="bricksnap-favorites";
function favorites(){
document.querySelector("#favorites").innerHTML=(JSON.parse(localStorage.getItem(key)||"[]")).map(x=>`<li>${x}</li>`).join("");
}
document.querySelector("#save").onclick=()=>{
const name=document.querySelector("#model").selectedOptions[0].text;
const items=JSON.parse(localStorage.getItem(key)||"[]");
items.push(name);
localStorage.setItem(key,JSON.stringify(items));
favorites();
};
document.querySelector("#photo").onchange=e=>{
const file=e.target.files[0];
if(!file)return;
const img=document.querySelector("#preview");
img.src=URL.createObjectURL(file);img.style.display="block";
};
function resize(){
const w=viewer.clientWidth,h=viewer.clientHeight;
camera.aspect=w/h;camera.updateProjectionMatrix();
renderer.setSize(w,h);
}
window.addEventListener("resize",resize);
resize();build();favorites();
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}
animate();
</script>
</body>
</html>
